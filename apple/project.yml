# The Xcode project is generated from this file: `xcodegen` (brew install xcodegen) in this folder.
name: SheetMusicPlayer
options:
  bundleIdPrefix: com.fitzgeraldryan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  SheetMusicPlayer:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SheetMusicPlayer
      # the web app, built by `npm run build:app`
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: SheetMusicPlayer/Info.plist
      properties:
        CFBundleDisplayName: Sheet Music Player
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Take photos of sheet music to turn into a score.
        NSMicrophoneUsageDescription: Listen to your piano so the music can wait for you.
        NSBluetoothAlwaysUsageDescription: Connect to a Bluetooth MIDI keyboard.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitzgeraldryan.SheetMusicPlayer
        PRODUCT_NAME: Sheet Music Player
        DEVELOPMENT_TEAM: GTK9G9EVU8
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SheetMusicPlayer/SheetMusicPlayer.entitlements
    preBuildScripts:
      - name: Check the web app is built
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/web/index.html" ]; then
            echo "error: apple/web is missing. Run 'npm install && npm run build:app' in the repository folder first."
            exit 1
          fi
